syntax = "proto3";

package campuscast.content;

import "common.proto";

service ContentService {
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (ContentAsset);
  rpc GetAsset(GetAssetRequest) returns (ContentAsset);
  rpc GetAssetInfo(GetAssetRequest) returns (ContentAssetInfo);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc RenameAsset(RenameAssetRequest) returns (ContentAsset);
  rpc UpdateAssetAvailability(UpdateAssetAvailabilityRequest) returns (ContentAssetInfo);
  rpc PruneUnusedAvailability(PruneUnusedAvailabilityRequest) returns (ContentAssetInfo);
  rpc DeleteAsset(DeleteAssetRequest) returns (ContentAsset);
}

message InitUploadRequest {
  string zone_id = 1;
  string filename = 2;
  string content_type = 3;         // MIME type
  int64 file_size = 4;
  map<string, string> metadata = 5;
}

message InitUploadResponse {
  string asset_id = 1;
  string upload_url = 2;           // pre-signed S3 PUT url
  campuscast.common.Timestamp expires_at = 3;
}

message CompleteUploadRequest {
  string asset_id = 1;
  string sha256_hash = 2;          // client-computed hash for verification
}

message ContentAsset {
  string asset_id = 1;
  string zone_id = 2;             // upload/origin zone
  string filename = 3;
  string content_type = 4;
  int64 file_size = 5;
  string sha256_hash = 6;
  string storage_key = 7;
  string status = 8;               // "uploading", "ready", "deleted"
  string signature = 9;            // base64-encoded signature
  string key_id = 10;
  map<string, string> metadata = 11;
  campuscast.common.Timestamp created_at = 12;
  campuscast.common.Timestamp updated_at = 13;
  repeated string zone_ids = 14;  // all zones where the asset is available
}

message ContentAssetUsageByZone {
  string zone_id = 1;
  int32 publication_count = 2;
}

message ContentAssetInfo {
  ContentAsset asset = 1;
  repeated ContentAssetUsageByZone usage_by_zone = 2;
  repeated string unused_zone_ids = 3;
}

message GetAssetRequest {
  string asset_id = 1;
}

message ListAssetsRequest {
  string zone_id = 1;             // legacy single-zone selector
  campuscast.common.Pagination pagination = 2;
  repeated string zone_ids = 3;   // multi-zone selector
}

message ListAssetsResponse {
  repeated ContentAsset assets = 1;
  campuscast.common.PaginatedResponse pagination = 2;
}

message DeleteAssetRequest {
  string asset_id = 1;
}

message RenameAssetRequest {
  string asset_id = 1;
  string filename = 2;
}

message UpdateAssetAvailabilityRequest {
  string asset_id = 1;
  repeated string zone_ids = 2;   // must leave the asset available in at least one zone
}

message PruneUnusedAvailabilityRequest {
  string asset_id = 1;
}
