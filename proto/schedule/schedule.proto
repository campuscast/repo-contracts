syntax = "proto3";

package campuscast.schedule;

import "common.proto";

service ScheduleService {
  // CRUD
  rpc CreateSchedule(CreateScheduleRequest) returns (Schedule);
  rpc GetSchedule(GetScheduleRequest) returns (Schedule);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);

  // Locking (core mode)
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc SaveDraft(SaveDraftRequest) returns (Schedule);

  // CRDT mode
  rpc IngestOps(IngestOpsRequest) returns (IngestOpsResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (ScheduleSnapshot);

  // Versioning & Publishing
  rpc CreateVersion(CreateVersionRequest) returns (ScheduleVersion);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc GetRelease(GetReleaseRequest) returns (Release);
}

message Schedule {
  string schedule_id = 1;
  string zone_id = 2;
  string name = 3;
  string status = 4;               // "draft", "locked", "published"
  int32 current_version = 5;
  string locked_by = 6;            // user_id if locked
  campuscast.common.Timestamp created_at = 7;
  campuscast.common.Timestamp updated_at = 8;
  repeated ScheduleSlot slots = 9;
}

message ScheduleSlot {
  string slot_id = 1;
  string asset_id = 2;
  campuscast.common.Timestamp start_time = 3;
  campuscast.common.Timestamp end_time = 4;
  int32 priority = 5;
  string zone_id = 6;
  string group_id = 7;
  map<string, string> metadata = 8;
}

message CreateScheduleRequest {
  string zone_id = 1;
  string name = 2;
}

message GetScheduleRequest {
  string schedule_id = 1;
}

message ListSchedulesRequest {
  string zone_id = 1;
  campuscast.common.Pagination pagination = 2;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
  campuscast.common.PaginatedResponse pagination = 2;
}

// Locking mode
message AcquireLockRequest {
  string schedule_id = 1;
  string user_id = 2;
  int32 ttl_seconds = 3;           // lock TTL, default 300
}

message AcquireLockResponse {
  bool acquired = 1;
  string lock_token = 2;
  string locked_by = 3;
  campuscast.common.Timestamp expires_at = 4;
}

message ReleaseLockRequest {
  string schedule_id = 1;
  string lock_token = 2;
}

message ReleaseLockResponse {
  bool released = 1;
}

message SaveDraftRequest {
  string schedule_id = 1;
  string lock_token = 2;
  repeated ScheduleSlot slots = 3;
}

// CRDT mode
message ScheduleOp {
  string op_type = 1;              // "add_slot", "remove_slot", "update_slot", "move_slot"
  campuscast.common.CausalMetadata causal = 2;
  campuscast.common.OperationSignature signature = 3;
  ScheduleSlot slot = 4;           // affected slot data
  map<string, string> params = 5;  // op-specific params
}

message IngestOpsRequest {
  string schedule_id = 1;
  repeated ScheduleOp ops = 2;
}

message IngestOpsResponse {
  int32 accepted = 1;
  int32 rejected = 2;
  repeated OpResult results = 3;
}

message OpResult {
  string operation_id = 1;
  bool accepted = 2;
  string reason = 3;               // if rejected, why
  repeated ScheduleOp compensating_ops = 4;  // auto-fix ops
  string explanation = 5;          // human-readable auto-transform explanation
}

message GetSnapshotRequest {
  string schedule_id = 1;
  int64 after_epoch = 2;           // optional: get ops after this epoch
}

message ScheduleSnapshot {
  string schedule_id = 1;
  int64 epoch = 2;
  repeated ScheduleSlot slots = 3;
  string snapshot_hash = 4;
  campuscast.common.Timestamp created_at = 5;
}

// Versioning
message CreateVersionRequest {
  string schedule_id = 1;
  string description = 2;
}

message ScheduleVersion {
  string version_id = 1;
  string schedule_id = 2;
  int32 version_number = 3;
  string description = 4;
  campuscast.common.Timestamp created_at = 5;
}

// Publishing
message PublishRequest {
  string schedule_id = 1;
  int32 version_number = 2;
  repeated string target_group_ids = 3;  // empty = all devices in zone, including devices without a group
}

message PublishResponse {
  string release_id = 1;
  bool validation_passed = 2;
  repeated ValidationIssue issues = 3;
}

message ValidationIssue {
  string severity = 1;            // "error", "warning", "info"
  string code = 2;
  string message = 3;
  string slot_id = 4;
}

message GetReleaseRequest {
  string release_id = 1;
}

message Release {
  string release_id = 1;
  string schedule_id = 2;
  int32 version_number = 3;
  string zone_id = 4;
  string manifest_url = 5;
  string manifest_signature = 6;
  string manifest_key_id = 7;
  string status = 8;              // "pending", "rolling_out", "active", "rolled_back"
  campuscast.common.Timestamp published_at = 9;
}
