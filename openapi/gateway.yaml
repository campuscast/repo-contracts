openapi: 3.1.0
info:
  title: CampusCast Distributed Media CMS — API Gateway
  version: 0.1.0
  description: |
    External REST API for the Distributed Media CMS.
    All endpoints require HTTPS. Auth via Bearer JWT.
servers:
  - url: https://localhost:3000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Zones
  - name: Devices
  - name: Content
  - name: Schedule
  - name: Player
  - name: Audit

paths:
  # ── Auth ──
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: JWT tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (stateless — clears server-side state if any)
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /me:
    get:
      tags: [Auth]
      summary: Get current user profile from access token
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          description: Invalid or expired token

  # ── Zones ──
  /zones:
    get:
      tags: [Zones]
      summary: List zones (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Zones list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Zone' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Zones]
      summary: Create zone (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Zone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'

  /zones/{zoneId}:
    put:
      tags: [Zones]
      summary: Update zone (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Zone updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'

  /zones/{zoneId}/policy:
    get:
      tags: [Zones]
      summary: Get policy for zone
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Zone policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePolicy'
    post:
      tags: [Zones]
      summary: Create policy for zone (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonePolicy'
      responses:
        '201':
          description: Zone policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePolicy'
    put:
      tags: [Zones]
      summary: Update policy for zone (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonePolicy'
      responses:
        '200':
          description: Zone policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePolicy'

  /zones/{zoneId}/groups:
    get:
      tags: [Zones]
      summary: List screen groups for zone (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Screen groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScreenGroup' }
    post:
      tags: [Zones]
      summary: Create screen group in zone (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Screen group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenGroup'

  /zones/{zoneId}/groups/{groupId}:
    delete:
      tags: [Zones]
      summary: Delete screen group (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /zones/{zoneId}/groups/{groupId}/layout:
    put:
      tags: [Zones]
      summary: Update screen group composition layout (admin)
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ScreenGroupLayoutItem'
      responses:
        '200':
          description: Screen group layout updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenGroup'

  /policy/check:
    post:
      tags: [Zones]
      summary: Policy decision check (zone-scoped or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCheckRequest'
      responses:
        '200':
          description: Access decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyCheckResponse'

  # ── Devices ──
  /devices/register:
    post:
      tags: [Devices]
      summary: Register a new device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDeviceResponse'

  /devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Get device info
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{deviceId}/runtime:
    get:
      tags: [Devices]
      summary: Get latest runtime state for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Device runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRuntime'

  /devices/{deviceId}/preview:
    get:
      tags: [Devices]
      summary: Get latest player screenshot/preview
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest device preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePreview'

  /devices/{deviceId}/preview-request:
    post:
      tags: [Devices]
      summary: Request a fresh screenshot from a device screen
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_id: { type: string, nullable: true }
      responses:
        '200':
          description: Screenshot request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePreviewRequestResponse'

  /devices/{deviceId}/assign:
    put:
      tags: [Devices]
      summary: Assign device to group
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: { type: string, description: Empty string removes the current group assignment }
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  # ── Content ──
  /content/init-upload:
    post:
      tags: [Content]
      summary: Initialize content upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitUploadRequest'
      responses:
        '200':
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitUploadResponse'

  /content/{assetId}/complete:
    post:
      tags: [Content]
      summary: Complete upload with hash verification
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256_hash]
              properties:
                sha256_hash: { type: string }
      responses:
        '200':
          description: Asset ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAsset'

  /content/asset/{assetId}:
    get:
      tags: [Content]
      summary: Get content asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAsset'

  /content/asset/{assetId}/info:
    get:
      tags: [Content]
      summary: Get content asset availability and publication usage by zone
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Asset info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAssetInfo'

  /content/{assetId}:
    patch:
      tags: [Content]
      summary: Rename content asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename: { type: string }
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAsset'
    delete:
      tags: [Content]
      summary: Permanently delete content asset from the library and storage
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Asset deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAsset'

  /content/{assetId}/availability:
    patch:
      tags: [Content]
      summary: Update content asset zone availability; at least one zone must remain
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_ids]
              properties:
                zone_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Asset availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAssetInfo'

  /content/{assetId}/availability/prune-unused:
    post:
      tags: [Content]
      summary: Remove content asset availability from every unused zone
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Asset availability pruned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAssetInfo'

  /content:
    get:
      tags: [Content]
      summary: List content assets
      parameters:
        - name: zone_id
          in: query
          required: false
          schema: { type: string }
        - name: zone_ids
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated list of zone IDs
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Content list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ContentAsset' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  publication_usage_by_asset:
                    type: object
                    additionalProperties:
                      type: integer
                      minimum: 0

  /publications:
    get:
      tags: [Content]
      summary: List publications by zone
      parameters:
        - name: zone_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Publication list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Publication' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Content]
      summary: Create publication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationCreateRequest'
      responses:
        '201':
          description: Publication created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'

  /publications/{publicationId}:
    get:
      tags: [Content]
      summary: Get publication details
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Publication details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
    patch:
      tags: [Content]
      summary: Update publication
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationUpdateRequest'
      responses:
        '200':
          description: Publication updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
    delete:
      tags: [Content]
      summary: Archive publication
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Publication archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'

  /publications/{publicationId}/copy:
    post:
      tags: [Content]
      summary: Copy publication into another zone and share referenced assets there
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationCopyRequest'
      responses:
        '200':
          description: Publication copy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'

  /publications/{publicationId}/restore:
    post:
      tags: [Content]
      summary: Restore archived publication
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Publication restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'

  /publications/{publicationId}/permanent:
    delete:
      tags: [Content]
      summary: Permanently delete publication
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Publication permanently deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDeleteResponse'

  # ── Schedule ──
  /schedules:
    post:
      tags: [Schedule]
      summary: Create schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_id, name]
              properties:
                zone_id: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    get:
      tags: [Schedule]
      summary: List schedules
      parameters:
        - name: zone_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Schedule list

  /schedules/{scheduleId}/lock:
    post:
      tags: [Schedule]
      summary: Acquire edit lock (core/locking mode)
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, default: 300 }
      responses:
        '200':
          description: Lock result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockResponse'
    delete:
      tags: [Schedule]
      summary: Release edit lock
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lock_token]
              properties:
                lock_token: { type: string }
      responses:
        '200':
          description: Lock released

  /schedules/{scheduleId}/save:
    post:
      tags: [Schedule]
      summary: Save draft slots (core/locking mode)
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots, lock_token]
              properties:
                slots:
                  type: array
                  items:
                    type: object
                lock_token:
                  type: string
      responses:
        '200':
          description: Updated schedule draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'

  /schedules/{scheduleId}/ops:
    post:
      tags: [Schedule]
      summary: Ingest operations via sync pipeline
      description: >
        Public entrypoint for BPMN-04. Gateway forwards to sync-service pipeline
        (signature verification, device trust, policy-check) before forwarding to schedule-service.
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items:
                    $ref: '#/components/schemas/ScheduleOp'
      responses:
        '200':
          description: Ingest result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestOpsResponse'

  /schedules/{scheduleId}/ops/sign:
    post:
      tags: [Schedule]
      summary: Sign schedule operations for editor session
      description: >
        Signs canonical schedule operation payloads for the authenticated editor user.
        Returned ops include actor context + signature and can be sent to sync-service intake.
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items:
                    $ref: '#/components/schemas/ScheduleOp'
      responses:
        '200':
          description: Signed operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedOpsResponse'

  /schedules/{scheduleId}/publish:
    post:
      tags: [Schedule]
      summary: Publish schedule version
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_number]
              properties:
                version_number: { type: integer }
                target_group_ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Publish result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'

  /schedules/{scheduleId}/validate:
    post:
      tags: [Schedule]
      summary: Pre-publish validation
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  # ── Player ──
  /player/release:
    get:
      tags: [Player]
      summary: Get latest release for device
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Release metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'

  /player/manifest/{releaseId}:
    get:
      tags: [Player]
      summary: Get signed manifest
      security:
        - bearerAuth: []
      parameters:
        - name: releaseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'

  /player/telemetry:
    post:
      tags: [Player]
      summary: Report player telemetry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryReport'
      responses:
        '200':
          description: Runtime accepted and optional device command returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerTelemetryResponse'

  /player/preview:
    post:
      tags: [Player]
      summary: Upload a player screenshot/preview frame
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePreviewUpload'
      responses:
        '200':
          description: Preview stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview_id: { type: string }
                  device_id: { type: string }
                  updated_at: { type: string, format: date-time, nullable: true }

  # ── Audit ──
  /audit:
    get:
      tags: [Audit]
      summary: Query audit events
      parameters:
        - name: zone_id
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
        - name: event_type
          in: query
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit events

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, maximum: 100 }

  schemas:
    TokenPair:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }

    UserMe:
      type: object
      required: [user, roles, zones]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
        roles: { type: array, items: { type: string } }
        zones: { type: array, items: { type: string } }
        crdt_enabled: { type: boolean, default: false }

    LogoutResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    Zone:
      type: object
      properties:
        zone_id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }

    ZonePolicy:
      type: object
      properties:
        id: { type: string }
        zone_id: { type: string }
        max_schedule_slots: { type: integer }
        max_content_size_mb: { type: integer }
        allowed_content_types: { type: array, items: { type: string } }
        crdt_enabled: { type: boolean }
        max_ops_per_minute: { type: integer }
        max_batch_size: { type: integer }
        priority_rules: { type: array, items: { type: object } }
        updated_at: { type: string, format: date-time }

    ScreenGroup:
      type: object
      properties:
        group_id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        layout_items:
          type: array
          items:
            $ref: '#/components/schemas/ScreenGroupLayoutItem'
        created_at: { type: string, format: date-time }

    ScreenGroupLayoutItem:
      type: object
      required: [device_id, display_id, x, y, width, height]
      properties:
        device_id: { type: string }
        display_id: { type: string }
        x: { type: number }
        y: { type: number }
        width: { type: integer }
        height: { type: integer }

    PolicyCheckRequest:
      type: object
      required: [zone_id, action]
      properties:
        user_id: { type: string }
        device_id: { type: string }
        zone_id: { type: string }
        action: { type: string }
        resource_id: { type: string }

    PolicyCheckResponse:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }

    RegisterDeviceRequest:
      type: object
      required: [device_name, device_type, zone_id]
      properties:
        device_name: { type: string }
        device_type: { type: string, enum: [android_tv, desktop, web] }
        hardware_id: { type: string }
        zone_id: { type: string }
        group_id: { type: string, nullable: true, description: Optional screen group assignment }

    RegisterDeviceResponse:
      type: object
      properties:
        device_id: { type: string }
        device_token: { type: string }
        mqtt_client_id: { type: string }
        mqtt_topic_prefix: { type: string }

    Device:
      type: object
      properties:
        device_id: { type: string }
        device_name: { type: string }
        device_type: { type: string }
        zone_id: { type: string }
        group_id: { type: string, nullable: true, description: Empty when the device is not assigned to any screen group }
        status: { type: string, enum: [pending, active, revoked, offline] }

    DeviceDisplay:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        selected: { type: boolean }

    ScreenshotRequest:
      type: object
      properties:
        request_id: { type: string }
        display_id: { type: string }
        requested_at: { type: string, format: date-time }

    DeviceRuntime:
      type: object
      properties:
        device_id: { type: string }
        device_name: { type: string }
        zone_id: { type: string }
        group_id: { type: string, nullable: true }
        status: { type: string }
        current_release_id: { type: string, nullable: true }
        current_slot_id: { type: string, nullable: true }
        current_publication_id: { type: string, nullable: true }
        current_publication_title: { type: string, nullable: true }
        current_publication_item_id: { type: string, nullable: true }
        current_publication_item_title: { type: string, nullable: true }
        playback_status: { type: string, nullable: true }
        online: { type: boolean, nullable: true }
        backend_status: { type: string, nullable: true }
        mqtt_status: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        last_telemetry_at: { type: string, format: date-time, nullable: true }
        displays:
          type: array
          items: { $ref: '#/components/schemas/DeviceDisplay' }
        selected_display_ids:
          type: array
          items: { type: string }
        screenshot_request:
          allOf:
            - $ref: '#/components/schemas/ScreenshotRequest'
          nullable: true

    DevicePreview:
      type: object
      properties:
        device_id: { type: string }
        device_name: { type: string }
        zone_id: { type: string }
        group_id: { type: string, nullable: true }
        preview_available: { type: boolean }
        image_base64: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        mime_type: { type: string }
        status: { type: string, nullable: true }
        captured_at: { type: string, format: date-time, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        display_id: { type: string, nullable: true }
        display_label: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    DevicePreviewRequestResponse:
      type: object
      properties:
        device_id: { type: string }
        request_id: { type: string }
        display_id: { type: string }
        requested_at: { type: string, format: date-time }

    DevicePreviewUpload:
      type: object
      properties:
        image_base64: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        mime_type: { type: string }
        captured_at: { type: string, format: date-time, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        status: { type: string, nullable: true }
        display_id: { type: string, nullable: true }
        display_label: { type: string, nullable: true }
        request_id: { type: string, nullable: true }

    InitUploadRequest:
      type: object
      required: [zone_id, filename, content_type, file_size]
      properties:
        zone_id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        file_size: { type: integer }

    InitUploadResponse:
      type: object
      properties:
        asset_id: { type: string }
        upload_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    ContentAsset:
      type: object
      properties:
        asset_id: { type: string }
        zone_id: { type: string }
        zone_ids:
          type: array
          items: { type: string }
        filename: { type: string }
        content_type: { type: string }
        file_size: { type: integer }
        sha256_hash: { type: string }
        storage_key: { type: string }
        status: { type: string, enum: [uploading, ready, deleted] }
        signature: { type: string }
        key_id: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContentAssetUsageByZone:
      type: object
      properties:
        zone_id: { type: string }
        publication_count: { type: integer, minimum: 0 }

    ContentAssetInfo:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/ContentAsset'
        usage_by_zone:
          type: array
          items: { $ref: '#/components/schemas/ContentAssetUsageByZone' }
        unused_zone_ids:
          type: array
          items: { type: string }

    PublicationItem:
      type: object
      properties:
        item_id: { type: string }
        type: { type: string, enum: [custom_slide, video_asset] }
        title: { type: string }
        duration_ms: { type: integer, minimum: 1000 }
        transition:
          type: object
          properties:
            type: { type: string, enum: [cut, fade] }
            duration_ms: { type: integer, minimum: 0 }
        slide:
          type: object
          properties:
            background: { type: string }
            title: { type: string }
            body: { type: string }
            image_asset_id: { type: string }
            external_url: { type: string }
            logo_asset_id: { type: string }
            layout: { type: string, enum: [centered, split, title-top] }
            image_fit: { type: string, enum: [cover, contain, stretch, center] }
            text_overlay: { type: boolean }
        video:
          type: object
          properties:
            asset_id: { type: string }
            trim_in_ms: { type: integer, minimum: 0 }
            trim_out_ms: { type: integer, minimum: 0 }
            mute: { type: boolean }
            loop: { type: boolean }
        metadata: { type: object }

    Publication:
      type: object
      properties:
        publication_id: { type: string }
        zone_id: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        version: { type: integer, minimum: 1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicationItem' }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicationCreateRequest:
      type: object
      required: [zone_id, title]
      properties:
        zone_id: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicationItem' }
        metadata: { type: object }

    PublicationUpdateRequest:
      type: object
      properties:
        title: { type: string }
        type: { type: string }
        status: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicationItem' }
        metadata: { type: object }

    PublicationCopyRequest:
      type: object
      required: [zone_id, title]
      properties:
        zone_id: { type: string }
        title: { type: string }

    PublicationDeleteResponse:
      type: object
      required: [deleted, publication_id, zone_id]
      properties:
        deleted: { type: boolean }
        publication_id: { type: string }
        zone_id: { type: string }

    Schedule:
      type: object
      properties:
        schedule_id: { type: string }
        zone_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [draft, locked, published] }
        current_version: { type: integer }

    ScheduleOp:
      type: object
      required: [op_type, causal, slot]
      properties:
        op_type: { type: string, enum: [add_slot, remove_slot, update_slot, move_slot] }
        causal:
          type: object
          required: [operation_id, client_id, lamport_ts]
          properties:
            operation_id: { type: string, format: uuid }
            client_id: { type: string }
            lamport_ts: { type: integer }
            vector_clock: { type: object }
            parent_op_id: { type: string }
            session_id: { type: string }
        actor:
          type: object
          properties:
            auth_type: { type: string, enum: [user_session, device_token] }
            user_id: { type: string }
            device_id: { type: string }
            session_id: { type: string }
        signature:
          type: object
          properties:
            signature: { type: string }
            key_id: { type: string }
            algorithm: { type: string }
        slot:
          type: object
          properties:
            slot_id: { type: string }
            asset_id: { type: string }
            publication_id: { type: string }
            start_time: { type: string, format: date-time }
            end_time: { type: string, format: date-time }
            priority: { type: integer }
            zone_id: { type: string }
            group_id: { type: string }

    SignedOpsResponse:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleOp'

    IngestOpsResponse:
      type: object
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              operation_id: { type: string }
              accepted: { type: boolean }
              reason: { type: string }
              explanation: { type: string }

    LockResponse:
      type: object
      properties:
        acquired: { type: boolean }
        lock_token: { type: string }
        locked_by: { type: string }
        expires_at: { type: string, format: date-time }

    PublishResponse:
      type: object
      properties:
        release_id: { type: string }
        validation_passed: { type: boolean }
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        has_fatal: { type: boolean }
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string }
        message: { type: string }
        slot_id: { type: string }

    Release:
      type: object
      properties:
        release_id: { type: string }
        schedule_id: { type: string }
        version_number: { type: integer }
        zone_id: { type: string }
        manifest_url: { type: string }
        manifest_signature: { type: string }
        manifest_key_id: { type: string }
        status: { type: string, enum: [pending, rolling_out, active, rolled_back] }

    Manifest:
      type: object
      required: [release_id, schedule_id, zone_id, version_number, slots, assets, created_at]
      properties:
        release_id: { type: string }
        schedule_id: { type: string }
        zone_id: { type: string }
        version_number: { type: integer }
        slots:
          type: array
          items:
            type: object
            properties:
              slot_id: { type: string }
              asset_id: { type: string }
              start_time: { type: string, format: date-time }
              end_time: { type: string, format: date-time }
              priority: { type: integer }
              zone_id: { type: string }
              group_id: { type: string }
              metadata: { type: object }
        assets:
          type: array
          items:
            type: object
            required: [asset_id, filename, sha256_hash, download_url]
            properties:
              asset_id: { type: string }
              filename: { type: string }
              content_type: { type: string }
              file_size: { type: integer }
              sha256_hash: { type: string }
              download_url: { type: string, format: uri }
              metadata: { type: object }
        manifest_hash: { type: string }
        signature: { type: string }
        key_id: { type: string }
        created_at: { type: string, format: date-time }

    TelemetryReport:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string }
        current_release_id: { type: string, nullable: true }
        current_slot_id: { type: string, nullable: true }
        current_publication_id: { type: string, nullable: true }
        current_publication_title: { type: string, nullable: true }
        current_publication_item_id: { type: string, nullable: true }
        current_publication_item_title: { type: string, nullable: true }
        playback_status: { type: string, nullable: true }
        errors: { type: array, items: { type: string } }
        displays:
          type: array
          items: { $ref: '#/components/schemas/DeviceDisplay' }
        selected_displays:
          type: array
          items: { type: string }
        timestamp: { type: string, format: date-time, nullable: true }
        online: { type: boolean, nullable: true }
        backend_status: { type: string, nullable: true }
        mqtt_status: { type: string, nullable: true }
        last_error: { type: string, nullable: true }

    PlayerTelemetryResponse:
      type: object
      properties:
        screenshot_request:
          allOf:
            - $ref: '#/components/schemas/ScreenshotRequest'
          nullable: true

    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
